<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="amberWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="metallic" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="20" fill="#fef3c7"/>
  <!-- Can Body -->
  <rect x="50" y="55" width="100" height="110" rx="14" fill="url(#amberWood)"/>
  <!-- Top Lid -->
  <ellipse cx="100" cy="55" rx="50" ry="16" fill="url(#metallic)"/>
  <ellipse cx="100" cy="55" rx="35" ry="10" fill="#475569"/>
  <!-- Bottom Rim -->
  <ellipse cx="100" cy="165" rx="50" ry="14" fill="#78350f"/>
  <!-- Label -->
  <rect x="54" y="85" width="92" height="55" rx="6" fill="#fffbeb" opacity="0.95"/>
  <text x="100" y="105" text-anchor="middle" fill="#92400e" font-family="sans-serif" font-size="11" font-weight="bold">SYNTHETIC</text>
  <text x="100" y="120" text-anchor="middle" fill="#78350f" font-family="sans-serif" font-size="13" font-weight="900">VARNISH</text>
  <text x="100" y="132" text-anchor="middle" fill="#d97706" font-family="sans-serif" font-size="9" font-weight="bold">★ HIGH GLOSS ★</text>
  <!-- Gloss shine reflection -->
  <path d="M60 65 Q85 110 65 155" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
</svg>
