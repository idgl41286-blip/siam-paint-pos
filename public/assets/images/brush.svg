  <rect x="75" y="70" width="50" height="30" rx="2" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
  <!-- Rivets -->
  <circle cx="85" cy="85" r="2.5" fill="#475569"/>
  <circle cx="100" cy="85" r="2.5" fill="#475569"/>
  <circle cx="115" cy="85" r="2.5" fill="#475569"/>
  <!-- Bristles with wet paint dip -->
