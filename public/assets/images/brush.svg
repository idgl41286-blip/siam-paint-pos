<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bristles" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="20" fill="#f8fafc"/>
  <!-- Wooden Handle -->
  <path d="M92 180 L88 100 L112 100 L108 180 Q100 188 92 180 Z" fill="#b45309" stroke="#78350f" stroke-width="2"/>
  <circle cx="100" cy="170" r="4" fill="#78350f"/>
