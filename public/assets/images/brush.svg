  <line x1="85" y1="70" x2="82" y2="30" stroke="#64748b" stroke-width="1"/>
  <line x1="100" y1="70" x2="100" y2="28" stroke="#64748b" stroke-width="1"/>
  <line x1="115" y1="70" x2="118" y2="30" stroke="#64748b" stroke-width="1"/>
</svg>
