<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="metalDrum" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="40%" stop-color="#94a3b8"/>
      <stop offset="60%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="20" fill="#f8fafc"/>
  <!-- Drum / Container -->
  <rect x="52" y="55" width="96" height="110" rx="12" fill="url(#metalDrum)"/>
  <!-- Ribs -->
  <line x1="52" y1="85" x2="148" y2="85" stroke="#1e293b" stroke-width="3"/>
  <line x1="52" y1="135" x2="148" y2="135" stroke="#1e293b" stroke-width="3"/>
  <!-- Spout Cap -->
  <circle cx="120" cy="50" r="8" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <rect x="75" y="44" width="25" height="10" rx="2" fill="#64748b"/>
  <!-- Label -->
  <rect x="62" y="92" width="76" height="36" rx="4" fill="#0284c7"/>
  <text x="100" y="106" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="900">NC THINNER</text>
  <text x="100" y="120" text-anchor="middle" fill="#fef08a" font-family="sans-serif" font-size="8" font-weight="bold">SUPER GRADE</text>
</svg>
